<div class="row">
    <div class="col-sm-12">
        <nav class="navbar mb-4 px-3 rounded logo gradient-blue">
            <div class="logo text-white  ml-2">
                <span>🔄</span> Conciliação - NFS-e
            </div>
            <a class="btn" href="/app/center/card.nl?sc=-29&whence="
                style="background-color: rgba(255, 255, 255, 0.15); border: 1px solid white; color: white;">
                🏠 Início
            </a>
        </nav>
    </div>
</div>

<div class="row">
    <div class="col-sm-12">

        <div class="card shadow-sm">
            <div class="card-header button" data-toggle="collapse" data-target="#filter-container" aria-expanded="true"
                aria-controls="filter-container">
                🔍 </i>Filtros
            </div>
            <div class="card-body collapse show" id="filter-container">
                <div class="row">
                    <div class="col-sm-3">
                        <div class="form-group">
                            <input class="form-control" placeholder="Digite o CNPJ Prestador" id="vendor-cnpj-filter" />
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <input class="form-control autocomplete" placeholder="Carregando Subsidiária"
                                id="subsidiary" data-restlet-script-id="customscript_pd_ai_subsidiary_rt"
                                data-restlet-deployment-id="customdeploy_pd_ai_subsidiary_rt"
                                data-placeholder="Digite a Subsidiária" data-autocomplete-max-items="10" />
                            <!-- <input class="form-control" placeholder="Digite o CNPJ Tomador" id="taker-cnpj-filter" /> -->
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <input class="form-control" placeholder="Digite o Número da Nota" id="doc-number-filter" />
                        </div>
                    </div>
                    <div class="col-sm-3">
                        <div class="form-group">
                            <input class="form-control autocomplete" placeholder="Carregando Categoria"
                                id="vendor-category-filter"
                                data-restlet-script-id="customscript_pd_ai_vendor_category_rt"
                                data-restlet-deployment-id="customdeploy_pd_ai_vendor_category_rt"
                                data-placeholder="Digite a Categoria" data-autocomplete-max-items="10" />
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-4">
                        <h6 class="form-label">📅</i> Data</h6>
                        <hr>
                        <div class="row">
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <input type="text" class="form-control date-picker" id="start-date-filter"
                                        date-validation="date" placeholder="DD/MM/YYYY" />
                                </div>
                            </div>
                            <div class="col-sm-6">
                                <div class="form-group">
                                    <input type="text" class="form-control date-picker" id="end-date-filter"
                                        date-validation="date" placeholder="DD/MM/YYYY" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12">
                        <input class="hidden" id="page-number" />
                        <input class="hidden" id="first-page" />
                        <input class="hidden" id="last-page" />
                        <hr style="margin-top: 0px;" />
                        <button type="button" class="btn btn-sm btn-light  text-white gradient-blue"
                            onclick="applyFilter(this)">🔍</i> Aplicar
                            Filtro</button>
                        <button type="button" class="btn btn-sm btn-light text-white gradient-orange"
                            onclick="clearFilter(this)"> 🔄</i> Limpar
                            Filtro</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="row" style="margin-top: 20px;">
    <div class="col-sm-12">
        <div class="card shadow-sm">
            <div class="card-header">
                📜 Lista NFS-e
                <button id='amount-management-button' type="button" class="btn btn-sm btn-light float-right mr-2"
                    onclick="reconcileNotes(this)">🔄 Conciliar Notas</button>
                <button id='insert-data-button' type="button" class="btn btn-sm btn-light float-right mr-2"
                    onclick="openValueEntry(this)">⚙️ Inserir Dados</button>
                <button id="remove-data-button" type="button" class="btn btn-sm btn-light float-right mr-2"
                    onclick="removeData(this)" hidden>
                    <i class="fa fa-trash text-danger"></i> Remover Dados
                </button>
            </div>
            <div class="card-body" id="card-body-nfse-list">
                <div class="row">
                    <div class="col-sm-12">
                        <table class="table table-sm table-striped table-hover" id="nfse-list"
                            style="margin-bottom: 0px; margin-top: 20px;" data-unique-id="id">
                            <tbody>
                                <tr>
                                    <td colspan="100">
                                        <div class="card">
                                            <div class="card-body">
                                                <h6><span class="empty-table-message">
                                                        <i class="fa fa-exclamation text-info">
                                                        </i>Aguardando parâmetros!
                                                    </span></h6>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div>

</div>

                <tbody>
                    <tr>
                        <td colspan="100">
                            <div class="card">
                                <div class="card-body">
                                    <h6><span class="empty-table-message">
                                            <i class="fa fa-exclamation text-info">
                                            </i>Aguardando parâmetros!
                                        </span></h6>
                                </div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</template>
